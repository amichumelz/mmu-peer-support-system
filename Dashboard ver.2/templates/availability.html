{% extends "base.html" %}
{% block content %}
<div class="p-8">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Availability Management</h1>
            <p class="text-gray-600 text-sm">Set your available hours for student bookings.</p>
        </div>
        <button class="bg-teal-600 text-white px-4 py-2 rounded-lg flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i> Add Time Slot
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="p-4 text-xs font-semibold text-gray-500 uppercase">Day</th>
                    <th class="p-4 text-xs font-semibold text-gray-500 uppercase">Time Range</th>
                    <th class="p-4 text-xs font-semibold text-gray-500 uppercase">Status</th>
                    <th class="p-4 text-xs font-semibold text-gray-500 uppercase">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for slot in slots %}
                <tr class="hover:bg-gray-50">
                    <td class="p-4 font-medium text-gray-900">{{ slot.day }}</td>
                    <td class="p-4 text-gray-600">{{ slot.start_time }} - {{ slot.end_time }}</td>
                    <td class="p-4">
                        <span class="px-2 py-1 rounded-full text-xs {% if slot.status == 'Available' %}bg-green-100 text-green-700{% else %}bg-gray-100 text-gray-700{% endif %}">
                            {{ slot.status }}
                        </span>
                    </td>
                    <td class="p-4">
                        <button class="text-red-500 hover:text-red-700 text-sm">Remove</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
